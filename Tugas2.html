    <h2>Tugas 4 - JavaScript</h2>

    <div id="program">

        <label>Nama :</label>
        <input type="text" id="nama">

        <br><br>

        <label>Jumlah Pilihan :</label>
        <input type="number" id="jumlah">

        <br><br>

        <button onclick="buatPilihan()">OK</button>

    </div>


<script>

let nama = "";
let jumlah = 0;
let pilihan = [];


// ================================
// INPUT NAMA DAN JUMLAH PILIHAN
// ================================

function buatPilihan() {

    nama = document.getElementById("nama").value.trim();

    jumlah = parseInt(
        document.getElementById("jumlah").value
    );

    if (nama === "") {
        alert("Nama harus diisi!");
        return;
    }

    if (isNaN(jumlah) || jumlah < 1) {
        alert("Jumlah pilihan harus diisi!");
        return;
    }


    let hasil = "";

    hasil += "<h3>Data Diri</h3>";

    hasil += "Nama : ";
    hasil += "<input type='text' value='" + nama + "' readonly>";

    hasil += "<br><br>";

    hasil += "Jumlah Pilihan : ";
    hasil += "<input type='number' value='" + jumlah + "' readonly>";

    hasil += "<br><br>";

    hasil += "<h3>Masukkan Pilihan</h3>";


    for (let i = 1; i <= jumlah; i++) {

        hasil += "Pilihan " + i + " : ";

        hasil += "<input type='text' id='pilihan" + i + "'>";

        hasil += "<br><br>";
    }


    hasil += "<button onclick='buatRadio()'>OK</button>";


    document.getElementById("program").innerHTML = hasil;
}



// ================================
// MEMBUAT RADIO BUTTON
// ================================

function buatRadio() {

    pilihan = [];

    for (let i = 1; i <= jumlah; i++) {

        let teks =
            document.getElementById("pilihan" + i).value.trim();


        if (teks === "") {

            alert("Pilihan " + i + " harus diisi!");

            return;
        }


        pilihan.push(teks);
    }


    let hasil = "";

    hasil += "<h3>Pilihan</h3>";


    for (let i = 0; i < pilihan.length; i++) {

        hasil +=
            "<input type='radio' name='pilihan' " +
            "value='" + pilihan[i] + "'> ";

        hasil += pilihan[i];

        hasil += "<br><br>";
    }


    hasil += "<button onclick='buatEmail()'>OK</button>";


    document.getElementById("program").innerHTML = hasil;
}



// ================================
// INPUT EMAIL
// ================================

function buatEmail() {

    let pilihanDipilih =
        document.querySelector(
            "input[name='pilihan']:checked"
        );


    if (!pilihanDipilih) {

        alert("Silakan pilih salah satu pilihan!");

        return;
    }


    let hasil = "";

    hasil += "<h3>Email</h3>";

    hasil += "Email : ";

    hasil += "<input type='text' id='email'>";

    hasil += "<br><br>";

    hasil += "<button onclick='hasilAkhir()'>OK</button>";


    document.getElementById("program").innerHTML = hasil;
}



// ================================
// HASIL AKHIR
// ================================

function hasilAkhir() {

    let email =
        document.getElementById("email").value.trim();


    if (email === "") {

        alert("Email harus diisi!");

        return;
    }


    // pengecekan email

    let polaEmail =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    if (!polaEmail.test(email)) {

        alert("Format email tidak valid!");

        return;
    }


    let pilihanDipilih =
        document.querySelector(
            "input[name='pilihan']:checked"
        );


    if (!pilihanDipilih) {

        alert("Silakan pilih pilihan!");

        return;
    }


    let pilihanSaya =
        pilihanDipilih.value;


    let daftar = "";


    for (let i = 0; i < pilihan.length; i++) {

        if (i === pilihan.length - 1) {

            daftar += "dan " + pilihan[i];

        } else {

            daftar += pilihan[i] + ", ";
        }
    }


    let hasil = "";

    hasil += "<h2>Hasil</h2>";

    hasil +=
        "Hallo, nama saya <b>" +
        nama +
        "</b>, email <b>" +
        email +
        "</b>.";

    hasil +=
        " Saya mempunyai sejumlah <b>" +
        jumlah +
        "</b> pilihan yaitu <b>" +
        daftar +
        "</b>.";

    hasil +=
        " Dan saya memilih <b>" +
        pilihanSaya +
        "</b>.";


    document.getElementById("program").innerHTML = hasil;
}

</script>
